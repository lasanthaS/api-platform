# Local-dev override, loaded automatically by `docker compose` (no -f flag
# needed) alongside docker-compose.yaml. docker-compose.yaml itself pins
# released `image:` tags (what `make dist`'s zip and a real deployment use);
# this file adds a matching `build:` for each service so a working-tree
# checkout builds and runs against its own local changes instead of pulling
# those pinned images.
#
# Usage:
#   ./scripts/setup.sh --profiles=api-control-plane,platform-api   # once, generates secrets
#   docker compose build
#   docker compose --profile api-control-plane --profile platform-api up -d
#
# Delete or rename this file (or run with --file docker-compose.yaml only)
# to fall back to the pinned, published images instead.

services:
  platform-api:
    build:
      context: ../../platform-api
      dockerfile: Dockerfile
      additional_contexts:
        common: ../../common
        httpkit: ../../httpkit

  api-control-plane:
    build:
      context: .
      dockerfile: Dockerfile
